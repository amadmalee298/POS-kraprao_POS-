; ครัวกะเพรา POS — เครื่องรับออเดอร์ ESP32 จอ 2.8" (ESP32-2432S028R / "Cheap Yellow Display")
; ILI9341 240x320 + ทัชสกรีน XPT2046, Wi-Fi
; Build:  pio run          Upload: pio run -t upload        Serial: pio device monitor

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; firmware + Thai font + LVGL is bigger than the default 1.2 MB app partition
board_build.partitions = huge_app.csv
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.2.0
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=1
